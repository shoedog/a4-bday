name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        shell: bash
        env:
          CONTACT_PHONE: ${{ vars.CONTACT_PHONE }}
          CONTACT_PHONE_HREF: ${{ vars.CONTACT_PHONE_HREF }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html styles.css app.js dist/
          cp assets/hero-unicorn.jpg dist/assets/
          touch dist/.nojekyll

          node <<'NODE'
          const fs = require("node:fs");
          const required = [
            "CONTACT_PHONE",
            "CONTACT_PHONE_HREF",
            "CONTACT_EMAIL",
            "SITE_URL",
            "SUPABASE_URL",
            "SUPABASE_ANON_KEY"
          ];
          const missing = required.filter((name) => !process.env[name]);

          if (missing.length) {
            console.error(`Missing required GitHub Actions variables: ${missing.join(", ")}`);
            process.exit(1);
          }

          const siteUrl = process.env.SITE_URL.replace(/\/+$/, "");

          const config = {
            contactName: "Ava's family",
            contactPhone: process.env.CONTACT_PHONE,
            contactPhoneHref: process.env.CONTACT_PHONE_HREF,
            contactEmail: process.env.CONTACT_EMAIL,
            siteUrl,
            supabaseUrl: process.env.SUPABASE_URL,
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
            allowLocalDemo: false
          };

          fs.writeFileSync(
            "dist/config.js",
            `window.AVA_PARTY_CONFIG = ${JSON.stringify(config, null, 2)};\n`
          );

          const indexPath = "dist/index.html";
          const indexHtml = fs.readFileSync(indexPath, "utf8")
            .replace(
              'property="og:image" content="assets/hero-unicorn.jpg"',
              `property="og:image" content="${siteUrl}/assets/hero-unicorn.jpg"`
            );
          fs.writeFileSync(indexPath, indexHtml);
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
